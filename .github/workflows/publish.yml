name: Publish image and propose release
on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "Dockerfile"
      - ".dockerignore"
      - "scripts/update_image.py"
      - ".github/workflows/publish.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-dev
  cancel-in-progress: false
jobs:
  publish:
    if: ${{ vars.WORKSHOP_PUBLISH_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Require main branch
        shell: bash
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Publish must run from main"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Test before publishing
        run: |
          python -m unittest discover -s app -p "test_*.py" -v
          python -m unittest discover -s scripts -p "test_*.py" -v
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Build in ACR and resolve digest
        id: image
        shell: bash
        env:
          ACR_NAME: ${{ vars.ACR_NAME }}
        run: |
          set -euo pipefail
          az acr build --registry "$ACR_NAME" --image "workshop-app:$GITHUB_SHA" \
            --build-arg "APP_VERSION=$GITHUB_SHA" .
          registry=$(az acr show --name "$ACR_NAME" --query loginServer -o tsv)
          digest=$(az acr repository show --name "$ACR_NAME" \
            --image "workshop-app:$GITHUB_SHA" --query digest -o tsv)
          echo "registry=$registry" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Get release App token
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Checkout current main for release proposal
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ steps.app.outputs.token }}
      - name: Open digest promotion PR
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REGISTRY: ${{ steps.image.outputs.registry }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          if [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
            echo "::error::main advanced during the build. Run publish again from current main."
            exit 1
          fi
          python scripts/update_image.py --registry "$REGISTRY" --digest "$DIGEST"
          if git diff --quiet; then
            echo "The desired digest is already in Git." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          branch="release/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$branch"
          git config user.name "workshop-release[bot]"
          git config user.email "workshop-release[bot]@users.noreply.github.com"
          git add deploy/overlays/dev/kustomization.yaml
          git commit -m "release: promote workshop-app ${GITHUB_SHA:0:12}"
          git push origin "$branch"
          printf 'Promote `%s/workshop-app@%s` built from source `%s`.\n\nBuild run: %s/%s/actions/runs/%s\n\nReview the digest, source PR, and CI before merging. Close older unmerged release PRs.\n' \
            "$REGISTRY" "$DIGEST" "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > /tmp/release-body.md
          url=$(gh pr create --base main --head "$branch" \
            --title "release: workshop-app ${GITHUB_SHA:0:12}" --body-file /tmp/release-body.md)
          echo "Release PR: $url" >> "$GITHUB_STEP_SUMMARY"
          echo "Image: $REGISTRY/workshop-app@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
